<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucky Draw Spinner</title>
    <link rel="stylesheet" href="odometer-theme.css" />
    <link rel="stylesheet" href="style.css" />
    <script src="odometer.js" defer></script>
    <script src="scripts.js" defer></script>
  </head>

  <body>
    <div id="fx" class="fx" aria-hidden="true"></div>

    <main class="stage">
      <div id="odometer" class="odometer">888</div>
      <button type="button" id="run" class="spin-button">Spin!</button>
    </main>

    <div class="panel-bar">
      <div class="panel-stack">
        <div class="inputs hide" id="inputs">
          <div class="input-min">
            <label for="min">Min:</label
            ><input type="number" id="min" min="1" value="1" />
          </div>
          <div class="input-max">
            <label for="max">Max:</label
            ><input type="number" id="max" min="1" value="550" />
          </div>

          <button type="button" id="clear-winners" class="clear-winners">
            Clear winners
          </button>
        </div>

        <div class="winners hide" id="winners">
          <label for="winners-field">Winners</label>
          <textarea id="winners-field"></textarea>
        </div>
      </div>

      <div class="panel-toggles">
        <button
          type="button"
          id="toggle-settings"
          class="panel-toggle"
          aria-controls="inputs"
          aria-expanded="false"
        >
          Show settings
        </button>
        <button
          type="button"
          id="toggle-winners"
          class="panel-toggle"
          aria-controls="winners"
          aria-expanded="false"
        >
          Show winners
        </button>
      </div>
    </div>
  </body>
</html>
